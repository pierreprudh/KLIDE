<title id="title">Reliable agent messages: before and after</title><desc id="desc">Send receipts preserve the original delivery state, report reply waits separately, and reject third-party replies.</desc>
<text x="48" y="48" class="label muted">KLIDE / AGENT COORDINATION</text>
<text x="48" y="100" class="title">Every message has a truthful receipt.</text>
<text x="48" y="133" class="body muted">Behavior comparison · protocol examples, not app screenshots</text>
<rect x="48" y="168" width="532" height="354" rx="12" fill="#ffffff" stroke="#d7ddcf"/>
<rect x="604" y="168" width="548" height="354" rx="12" fill="#edf2e6" stroke="#d7ddcf"/>
<text x="72" y="204" class="label muted">BEFORE</text>
<text x="628" y="204" class="label muted">AFTER</text>
<text x="72" y="247" class="body">Retry after approval</text>
<text x="628" y="247" class="body">Retry after approval</text>
<text x="72" y="279" class="code">deliveryState: &quot;queued&quot;</text>
<text x="628" y="279" class="code">deliveryState: &quot;accepted&quot;</text>
<text x="72" y="348" class="body">Read, but no answer before timeout</text>
<text x="628" y="348" class="body">Read, but no answer before timeout</text>
<text x="72" y="380" class="code">deliveryState: &quot;queued&quot;</text>
<text x="628" y="380" class="code">deliveryState: &quot;acknowledged&quot;</text>
<text x="628" y="408" class="code">replyStatus: &quot;timed_out&quot;</text>
<text x="72" y="447" class="body">An answer arrives</text>
<text x="628" y="447" class="body">An answer arrives</text>
<text x="72" y="479" class="code">deliveryState: &quot;acknowledged&quot;</text>
<text x="628" y="479" class="code">deliveryState: journal value</text>
<text x="628" y="507" class="code">replyStatus: &quot;received&quot;</text>
<text x="48" y="569" class="label muted">REPLIES STAY BETWEEN THE ORIGINAL PARTICIPANTS</text>
<rect x="48" y="592" width="330" height="95" rx="12" fill="#ffffff" stroke="#d7ddcf"/>
<rect x="402" y="592" width="354" height="95" rx="12" fill="#ffffff" stroke="#d7ddcf"/>
<rect x="780" y="592" width="372" height="95" rx="12" fill="#ffffff" stroke="#d7ddcf"/>
<text x="68" y="625" class="body">A sends a question to B</text>
<text x="68" y="657" class="small muted">One durable envelope id</text>
<text x="422" y="625" class="body">B replies to A</text>
<text x="422" y="657" class="small muted">Valid route · accepted automatically</text>
<text x="800" y="625" class="body">C cites that envelope id</text>
<text x="800" y="657" class="small muted">Rejected before a new event is written</text>
<text x="48" y="729" class="small muted">Native Harness + MCP share one Rust receipt. Existing journals remain readable.</text>
