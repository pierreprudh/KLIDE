<style>text{font-family:Arial,sans-serif;fill:#242820}.muted{fill:#646b60}.label{font-size:13px;letter-spacing:1.6px;font-weight:700}.code{font-family:Menlo,monospace;font-size:16px}.title{font-size:34px;font-weight:600}.body{font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#7a886a;stroke-width:2}</style>
