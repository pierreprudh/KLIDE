<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klide visual reviewer</title><style>body{margin:32px auto;padding:0 24px;max-width:920px;background:#f7f5f0;color:#293029;font:15px/1.5 system-ui}h1{font-size:24px}label{display:block;margin:14px 0 4px}input,textarea{box-sizing:border-box;width:100%;font:inherit;padding:8px;border:1px solid #b7bcb3;border-radius:6px;background:#fff;color:inherit}button{font:inherit;margin:16px 8px 0 0;padding:8px 14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#fff;border:1px solid #ddd}fieldset{border:0;padding:0}#status{font-weight:600}</style></head><body><h1>Native visual reviewer</h1><p>Development tool: verify a capture bundle and its scoped Mac verification, then start a tool-free reviewer through Klide’s normal Run host. This does not edit the workspace.</p><fieldset id="inputs"><label for="workspace">Workspace (absolute path)</label><input id="workspace" placeholder="/absolute/path/to/workspace"><label for="manifest">Capture manifest (relative to workspace)</label><input id="manifest" value="artifacts/design-feedback/review-ready-v2/manifest.json"><label for="parity">Native verification (relative to workspace)</label><input id="parity" value="artifacts/design-feedback/native-parity-2026-11-07/verification.json"><label for="captures">Capture IDs (comma separated, up to four)</label><input id="captures" value="klide-light-900x700-permission"><label for="provider">Native provider ID</label><input id="provider" value="ollama"><label for="model">Vision-capable model ID</label><input id="model" placeholder="An installed or connected vision model"><label for="brief">Review brief</label><textarea id="brief" rows="3">Inspect hierarchy, readability, action clarity and visible accessibility concerns. Report specific evidence-bound findings and uncertainty.</textarea></fieldset><button id="prepare">Verify evidence</button><button id="start" disabled>Start review with selected provider</button><button id="stop" disabled>Stop Run</button><button id="inspect" disabled>Inspect Run</button><button id="export" disabled>Export report</button><p id="status" role="status">No Run started.</p><pre id="receipt" aria-label="Evidence receipt"></pre><pre id="output" aria-label="Review output"></pre><script type="module" src="/preview/design-agent.ts"></script></body></html>
