# Native SSH hosts. Publish a revision only after all target smoke tests pass.
name: Native host binaries

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/remote-host/**'
      - 'tests/remote-*-smoke.py'
      - 'tests/windows-openssh-smoke.ps1'
      - '.github/workflows/linux-host.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: klide-linux-x86_64
          - runner: macos-15
            asset: klide-macos-aarch64
          - runner: macos-15-intel
            asset: klide-macos-x86_64
          - runner: windows-2025
            asset: klide-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
      KLIDE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: native-host-${{ env.PROFILE }}
          cache-on-failure: true
      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev \
            libxdo-dev pkg-config
      - name: Build console-capable native helper
        shell: bash
        run: |
          mkdir -p dist
          flags=()
          if [ "$PROFILE" = release ]; then flags+=(--release); fi
          # SSH installs a single Windows executable, without an MSI that
          # could install the Visual C++ runtime alongside it.
          if [ "$RUNNER_OS" = Windows ] && [ "$PROFILE" = release ]; then
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --target x86_64-pc-windows-msvc --bin klide --features remote-host --manifest-path src-tauri/Cargo.toml "${flags[@]}"
            mkdir -p src-tauri/target/release
            cp src-tauri/target/x86_64-pc-windows-msvc/release/klide.exe src-tauri/target/release/klide.exe
          else
            cargo build --bin klide --features remote-host --manifest-path src-tauri/Cargo.toml "${flags[@]}"
          fi
      - name: Native disconnect, replay and installation
        timeout-minutes: 4
        shell: bash
        run: |
          binary="src-tauri/target/$PROFILE/klide"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python -u tests/remote-machine-smoke.py "$binary"
          python -u tests/remote-install-smoke.py "$binary"
      - name: Native Windows over OpenSSH
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: ./tests/windows-openssh-smoke.ps1 -Binary "src-tauri/target/$env:PROFILE/klide.exe"
      - name: Target and kernel-lock tests
        shell: bash
        run: |
          cargo test --lib --manifest-path src-tauri/Cargo.toml remote_platform::
          cargo test --lib --manifest-path src-tauri/Cargo.toml process_lock::
          cargo test --lib --manifest-path src-tauri/Cargo.toml delegate::child::windows_job::
      - name: Package helper and checksum
        shell: python
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          import hashlib, os, pathlib, shutil
          binary = pathlib.Path('src-tauri/target') / os.environ['PROFILE'] / ('klide.exe' if os.name == 'nt' else 'klide')
          output = pathlib.Path('host-assets')
          output.mkdir()
          asset = output / os.environ['ASSET']
          shutil.copy2(binary, asset)
          asset.with_name(asset.name + '.sha256').write_text(hashlib.sha256(asset.read_bytes()).hexdigest() + '  ' + asset.name + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: host-assets/*
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: host-assets
          merge-multiple: true
      - name: Publish matching setup helpers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="host-${SOURCE_COMMIT}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_COMMIT" --prerelease --title "SSH helpers ${SOURCE_COMMIT:0:7}" --notes "Matching native Klide SSH helpers for Linux, macOS and Windows. Published after native disconnect/replay and installer smoke tests on every target."
          fi
          gh release upload "$tag" host-assets/* --clobber
