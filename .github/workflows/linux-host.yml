# Native SSH hosts. Each asset is uploaded only after its target's checks pass.
#
# Every push to main publishes `host-<sha>`: an app built from a commit
# installs the helper published for that exact commit (machine_install.rs),
# so main builds are never skipped or cancelled. A PR builds only when it
# touches the host itself — the files below — and on one macOS runner, not
# two: the free plan runs five macOS jobs at once across the whole repo.
name: Native host binaries

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/remote-helper/**']
  pull_request:
    paths:
      # The host: PTY daemon and wire, Remote machines, the run host, and
      # what the smoke tests below exercise.
      - 'src-tauri/src/pty*.rs'
      - 'src-tauri/src/remote_platform.rs'
      - 'src-tauri/src/machine*.rs'
      - 'src-tauri/src/providers.rs'
      - 'src-tauri/src/delegate/chat.rs'
      - 'src-tauri/src/machine_setup/**'
      - 'src-tauri/src/process_lock.rs'
      - 'src-tauri/src/windows_detach.rs'
      - 'src-tauri/src/durable.rs'
      - 'src-tauri/src/delegate/child.rs'
      - 'src-tauri/src/agent/remote_machine.rs'
      - 'src-tauri/src/agent/daemon*.rs'
      - 'src-tauri/src/agent/run_host.rs'
      - 'src-tauri/src/main.rs'
      # How it is built.
      - 'src-tauri/build.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'scripts/remote-host/**'
      - 'tests/remote-*-smoke.py'
      - 'tests/windows-openssh-smoke.ps1'
      - '.github/workflows/linux-host.yml'

concurrency:
  group: native-host-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # main publishes all five. A PR checks four: Intel macOS runs the
        # same code as Apple Silicon and would take a second macOS runner.
        include: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/heads/codex/remote-helper/') && '[{"runner":"ubuntu-24.04","asset":"klide-linux-x86_64"},{"runner":"ubuntu-24.04-arm","asset":"klide-linux-aarch64"},{"runner":"macos-15","asset":"klide-macos-aarch64"}]' || format('[{0}{1}]',
            '{"runner":"ubuntu-24.04","asset":"klide-linux-x86_64"},
             {"runner":"ubuntu-24.04-arm","asset":"klide-linux-aarch64"},
             {"runner":"macos-15","asset":"klide-macos-aarch64"},
             {"runner":"windows-2025","asset":"klide-windows-x86_64.exe"}',
            github.event_name != 'pull_request' && ',{"runner":"macos-15-intel","asset":"klide-macos-x86_64"}' || '')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
      KLIDE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PROFILE: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: native-host-${{ env.PROFILE }}
          cache-on-failure: true
      - name: Tauri system packages
        timeout-minutes: 20
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev \
            libxdo-dev pkg-config
      - name: Build console-capable native helper
        shell: bash
        run: |
          mkdir -p dist
          flags=()
          if [ "$PROFILE" = release ]; then flags+=(--release); fi
          # SSH installs a single Windows executable, without an MSI that
          # could install the Visual C++ runtime alongside it.
          if [ "$RUNNER_OS" = Windows ] && [ "$PROFILE" = release ]; then
            export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --target x86_64-pc-windows-msvc --bin klide --features remote-host --manifest-path src-tauri/Cargo.toml "${flags[@]}"
            mkdir -p src-tauri/target/release
            cp src-tauri/target/x86_64-pc-windows-msvc/release/klide.exe src-tauri/target/release/klide.exe
          else
            cargo build --bin klide --features remote-host --manifest-path src-tauri/Cargo.toml "${flags[@]}"
          fi
      - name: Check standalone Windows dependencies
        if: runner.os == 'Windows' && env.PROFILE == 'release'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'Cannot inspect native Windows helper dependencies' }
          $dependencies = & $dumpbin /DEPENDENTS src-tauri/target/release/klide.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the Windows helper' }
          $dependencies
          if ($dependencies -match '(?i)(VCRUNTIME|MSVCP|CONCRT)[^ ]*\.dll|WebView2Loader\.dll') {
            throw 'The SSH helper must not depend on an unbundled VC runtime or WebView2 loader DLL'
          }
      - name: Target and kernel-lock tests
        shell: bash
        run: |
          cargo test --lib --manifest-path src-tauri/Cargo.toml remote_platform::
          cargo test --lib --manifest-path src-tauri/Cargo.toml agent::remote_machine::tests::
          cargo test --lib --manifest-path src-tauri/Cargo.toml process_lock::
          cargo test --lib --manifest-path src-tauri/Cargo.toml delegate::child::windows_job::
          cargo test --lib --manifest-path src-tauri/Cargo.toml pty_daemon::windows_tests::
          cargo test --lib --manifest-path src-tauri/Cargo.toml windows_detach::
          cargo test --lib --manifest-path src-tauri/Cargo.toml durable::
      - name: Native disconnect and replay
        timeout-minutes: 4
        shell: bash
        run: |
          binary="src-tauri/target/$PROFILE/klide"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python -u tests/remote-machine-smoke.py "$binary"
          # Windows installation must be launched by the OpenSSH service,
          # outside GitHub's job container (which forbids breakaway).
          if [ "$RUNNER_OS" != Windows ]; then python -u tests/remote-install-smoke.py "$binary"; fi
      - name: Native Windows over OpenSSH
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: ./tests/windows-openssh-smoke.ps1 -Binary "src-tauri/target/$env:PROFILE/klide.exe"
      - name: Package helper and checksum
        shell: python
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          import hashlib, os, pathlib, shutil
          binary = pathlib.Path('src-tauri/target') / os.environ['PROFILE'] / ('klide.exe' if os.name == 'nt' else 'klide')
          output = pathlib.Path('host-assets')
          output.mkdir()
          asset = output / os.environ['ASSET']
          shutil.copy2(binary, asset)
          asset.with_name(asset.name + '.sha256').write_text(hashlib.sha256(asset.read_bytes()).hexdigest() + '  ' + asset.name + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: host-assets/*
          retention-days: 7

  publish:
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: host-assets
          pattern: klide-*
          merge-multiple: true
      - name: Publish matching setup helpers
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          manifests=(host-assets/*.sha256)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No verified helpers are available to publish."
            exit 0
          fi
          (cd host-assets && sha256sum --check ./*.sha256)
          tag="host-${SOURCE_COMMIT}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_COMMIT" --prerelease --title "SSH helpers ${SOURCE_COMMIT:0:7}" --notes "Matching native Klide SSH helpers. Each asset passed native disconnect/replay and installer smoke tests on its target. A missing target is still building or needs its checks rerun."
          fi
          gh release upload "$tag" host-assets/* --clobber
