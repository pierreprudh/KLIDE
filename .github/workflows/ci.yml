name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  rust:
    name: Rust tests
    # macOS is the shipped target; the keyring backend is per-platform in
    # Cargo.toml, so a Linux/Windows job is a runner-image question, not a
    # build one.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      # Without this the full Tauri dependency graph compiles cold every run,
      # pressing against the timeout on the priciest runner.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Windows and Linux are not shipped yet; this keeps them compiling and
  # their tests honest so the first real build on each is not an archaeology
  # dig. The frontend is not built here: `generate_context!` only needs the
  # `frontendDist` folder to exist.
  rust-other-os:
    name: Rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev \
            libxdo-dev pkg-config
      - run: mkdir -p dist
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-run
      # Windows compiles; its tests still assume a Unix host (35 of 1282 fail
      # on `/` paths, `sh` scripts, symlinks — listed in TODO.md). Run them
      # there once that list is worked down.
      - if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml
